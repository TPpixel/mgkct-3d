<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Интерактивная карта — Колледж МГКЦТ</title>
    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Three.js & OrbitControls -->
    <script src="js/vendor/three.min.js"></script>
    <script src="js/vendor/OrbitControls.js"></script>
    <!-- Стили -->
    <link rel="stylesheet" href="css/style.css?v=15">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
</head>
<body data-theme="light" class="overflow-hidden select-none">

    <!-- Контейнер Three.js сцены -->
    <div id="canvas-container"></div>
    <!-- 2D Canvas для кристально чётких надписей номеров кабинетов (Screen-Space Retina) -->
    <canvas id="labels-overlay-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:15; pointer-events:none;"></canvas>

    <!-- Верхняя панель навигации (на мобильном вверху, на ПК под поиском) -->
    <header class="ui-overlay fixed top-2 left-2 right-2 sm:top-[68px] sm:left-4 sm:right-auto z-20 flex items-center pointer-events-none transition-all duration-200">
        <div class="glass-panel rounded-2xl px-2 py-1.5 sm:px-2.5 sm:py-2 flex items-center gap-2 pointer-events-auto shadow-xl w-full sm:w-auto max-w-full overflow-hidden">
            <!-- Слева в углу: переключатель темы (Светлая / Тёмная) -->
            <button id="btn-toggle-theme" title="Сменить тему (Светлая / Тёмная)" class="btn-interactive theme-toggle-btn w-9 h-9 rounded-xl flex items-center justify-center transition shadow-sm flex-shrink-0">
                <svg id="theme-icon-sun" class="w-4 h-4 text-amber-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <svg id="theme-icon-moon" class="w-4 h-4 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>

            <!-- Горизонтальная строка выбора корпуса -->
            <div class="flex-1 min-w-0 flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
                <button id="btn-bldg-all" class="bldg-chip active" data-bldg="both">Все</button>
                <button id="btn-bldg-1" class="bldg-chip" data-bldg="1">Корпус 1</button>
                <button id="btn-bldg-2" class="bldg-chip" data-bldg="2">Корпус 2</button>
                <button id="btn-bldg-3" class="bldg-chip" data-bldg="3">Корпус 3</button>
                <button id="btn-bldg-4" class="bldg-chip" data-bldg="4">Корпус 4</button>
            </div>
        </div>
    </header>

    <!-- Панель поиска: на телефоне внизу, на ПК вверху слева (как в Яндекс.Картах) -->
    <div id="bottom-search-bar" class="ui-overlay fixed bottom-3 left-2 right-2 sm:bottom-auto sm:top-3 sm:left-4 sm:right-auto sm:w-[440px] z-20 pointer-events-none transition-all duration-300">
        <div class="glass-panel rounded-2xl p-2 flex items-center gap-2 pointer-events-auto shadow-2xl w-full">
            <!-- Виджет поиска кабинетов -->
            <button id="btn-open-search" class="btn-interactive flex-1 h-10 px-3.5 rounded-xl flex items-center gap-2.5 text-left min-w-0 transition">
                <svg class="w-4 h-4 text-sky-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <span id="search-widget-text" class="text-xs font-medium whitespace-nowrap overflow-hidden text-ellipsis">Поиск по колледжу...</span>
            </button>

            <!-- Кнопка навигатора (Маршрут) -->
            <button id="btn-open-navigator" title="Построить маршрут (Навигатор)" class="btn-interactive h-10 px-3.5 sm:px-4 rounded-xl flex items-center gap-1.5 bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xs border border-sky-400/30 transition shadow-md flex-shrink-0">
                <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 20l-5.447-2.724A2 2 0 012.5 15.485V5.515a2 2 0 011.053-1.79L9 1m0 19l6-3m-6 3V1m6 16l5.447 2.724A2 2 0 0021.5 17.939V7.969a2 2 0 00-1.053-1.79L15 3.447m0 13.553V3.447m0 0L9 1" />
                </svg>
                <span>Маршрут</span>
            </button>
        </div>
    </div>

    <!-- Правый плавающий селектор этажей (как в 2GIS / Google Maps / Яндекс.Картах) -->
    <nav class="ui-overlay floor-switcher-bar glass-panel" aria-label="Выбор этажа">
        <span class="floor-switcher-label text-[9px] font-extrabold uppercase tracking-widest my-0.5">Эт</span>
        <button id="floor-btn-7" class="floor-btn" data-floor="7" title="7 этаж">7</button>
        <button id="floor-btn-6" class="floor-btn" data-floor="6" title="6 этаж">6</button>
        <button id="floor-btn-5" class="floor-btn" data-floor="5" title="5 этаж">5</button>
        <button id="floor-btn-4" class="floor-btn" data-floor="4" title="4 этаж">4</button>
        <button id="floor-btn-3" class="floor-btn" data-floor="3" title="3 этаж">3</button>
        <button id="floor-btn-2" class="floor-btn" data-floor="2" title="2 этаж">2</button>
        <button id="floor-btn-1" class="floor-btn active" data-floor="1" title="1 этаж">1</button>
    </nav>

    <!-- Правые плавающие кнопки управления картой (Слои территории, 2D/3D, масштаб только на ПК) -->
    <div class="ui-overlay map-fab-bar">
        <!-- Кнопка переключения режима с прилегающей территорией (как слои в Яндекс/Google Картах) -->
        <button id="btn-toggle-territory" class="map-fab-btn" title="Прилегающая территория (дороги, деревья, окружение)" aria-label="Переключить отображение территории">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </button>

        <!-- Кнопка переключения 2D вид сверху / 3D изометрия -->
        <button id="btn-toggle-2d" class="map-fab-btn font-extrabold text-[12px]" title="Переключить 2D карта сверху / 3D ракурс">
            2D
        </button>

        <!-- Кнопки масштабирования (скрыты на смартфонах, доступны только на ПК) -->
        <div class="zoom-controls-group hidden sm:flex flex-col gap-0.5 glass-panel !rounded-xl p-0.5">
            <button id="btn-zoom-in" class="map-fab-btn !w-9 !h-9 !rounded-lg !border-none !shadow-none !bg-transparent" title="Приблизить">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
            <div class="zoom-divider h-[1px] mx-1.5"></div>
            <button id="btn-zoom-out" class="map-fab-btn !w-9 !h-9 !rounded-lg !border-none !shadow-none !bg-transparent" title="Отдалить">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M20 12H4" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Модальное окно поиска кабинетов -->
    <div id="search-backdrop" class="drawer-backdrop"></div>
    <div id="search-modal" class="search-modal glass-panel p-3.5 sm:p-4 flex flex-col gap-2.5 sm:gap-3">
        <div class="flex items-center justify-between pb-1.5 border-b border-slate-700/60 flex-shrink-0">
            <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <span class="text-xs font-bold text-slate-200 uppercase tracking-wider">Поиск кабинета</span>
            </div>
            <button id="btn-close-search" class="text-slate-400 hover:text-slate-100 p-1 rounded-lg transition">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="relative flex-shrink-0">
            <input id="search-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
                   placeholder="Введите номер (например, 2-102, 1-105, столовая)..." 
                   class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-[16px] sm:text-xs text-slate-100 placeholder-slate-500 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition">
        </div>

        <!-- Быстрые теги ключевых аудиторий с названиями -->
        <div class="flex flex-wrap items-center gap-1.5 py-0.5 text-[11px] flex-shrink-0">
            <button class="search-tag-chip px-2.5 py-1 rounded-lg transition font-medium" data-query="Столовая">Столовая</button>
            <button class="search-tag-chip px-2.5 py-1 rounded-lg transition font-medium" data-query="Спортзал">Спортзал</button>
            <button class="search-tag-chip px-2.5 py-1 rounded-lg transition font-medium" data-query="Актовый зал">Актовый зал</button>
            <button class="search-tag-chip px-2.5 py-1 rounded-lg transition font-medium" data-query="Библиотека">Библиотека</button>
            <button class="search-tag-chip px-2.5 py-1 rounded-lg transition font-medium" data-query="Гардероб">Гардероб</button>
            <button class="search-tag-chip px-2.5 py-1 rounded-lg transition font-medium" data-query="Конференц-зал">Конференц-зал</button>
            <button class="search-tag-chip px-2.5 py-1 rounded-lg transition font-medium" data-query="С/У">Санузел</button>
        </div>

        <!-- Список результатов -->
        <div id="search-results" class="search-results-list overflow-y-auto custom-scroll flex flex-col gap-1 pr-1 min-h-0 flex-1">
            <div class="text-center py-6 text-xs text-slate-500">Начните ввод номера аудитории...</div>
        </div>
    </div>

    <!-- Модальное окно Навигатора (Маршрут в стиле Google Maps) -->
    <div id="navigator-backdrop"></div>
    <div id="navigator-modal" class="glass-panel p-3.5 sm:p-4 flex flex-col gap-2.5 sm:gap-3">
        <div class="flex items-center justify-between pb-1.5 border-b border-slate-700/60 flex-shrink-0">
            <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 20l-5.447-2.724A2 2 0 012.5 15.485V5.515a2 2 0 011.053-1.79L9 1m0 19l6-3m-6 3V1m6 16l5.447 2.724A2 2 0 0021.5 17.939V7.969a2 2 0 00-1.053-1.79L15 3.447m0 13.553V3.447m0 0L9 1" />
                </svg>
                <span class="text-xs font-bold text-slate-100 uppercase tracking-wider">Маршрут по колледжу</span>
            </div>
            <button id="btn-close-navigator" class="text-slate-400 hover:text-slate-100 p-1 rounded-lg transition">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Поля ввода маршрута (Google Maps стиль) -->
        <div class="flex items-center gap-2 relative flex-shrink-0">
            <div class="flex flex-col gap-2 flex-1 min-w-0">
                <!-- Откуда (Точка А) -->
                <div class="relative">
                    <div class="absolute left-3 top-1/2 -translate-y-1/2 flex items-center pointer-events-none">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-emerald-500/30"></span>
                    </div>
                    <input id="nav-input-start" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
                           placeholder="Откуда: кабинет, зал, главный вход..." 
                           class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-8 pr-20 py-2 text-[16px] sm:text-xs text-slate-100 placeholder-slate-500 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition">
                    <button id="btn-clear-start" type="button" title="Очистить поле" class="absolute right-14 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 px-1.5 py-1 rounded hidden text-xs transition">
                        ✕
                    </button>
                    <button id="btn-pick-start" title="Указать точку на карте" class="nav-pick-btn absolute right-1.5 top-1/2 -translate-y-1/2 px-2 py-1 rounded-lg text-[10px] font-semibold transition flex items-center gap-1">
                        Карта
                    </button>
                    <!-- Выпадающий список автозаполнения Откуда -->
                    <div id="nav-dropdown-start" class="nav-autocomplete-dropdown absolute left-0 right-0 top-full mt-1 rounded-xl shadow-2xl z-50 max-h-44 overflow-y-auto custom-scroll hidden"></div>
                </div>

                <!-- Куда (Точка Б) -->
                <div class="relative">
                    <div class="absolute left-3 top-1/2 -translate-y-1/2 flex items-center pointer-events-none">
                        <span class="w-2.5 h-2.5 rounded-full bg-rose-500 ring-2 ring-rose-500/30"></span>
                    </div>
                    <input id="nav-input-dest" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
                           placeholder="Куда: номер кабинета, столовая, спортзал..." 
                           class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-8 pr-20 py-2 text-[16px] sm:text-xs text-slate-100 placeholder-slate-500 outline-none focus:border-rose-500 focus:ring-2 focus:ring-rose-500/20 transition">
                    <button id="btn-clear-dest" type="button" title="Очистить поле" class="absolute right-14 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 px-1.5 py-1 rounded hidden text-xs transition">
                        ✕
                    </button>
                    <button id="btn-pick-dest" title="Указать точку на карте" class="nav-pick-btn absolute right-1.5 top-1/2 -translate-y-1/2 px-2 py-1 rounded-lg text-[10px] font-semibold transition flex items-center gap-1">
                        Карта
                    </button>
                    <!-- Выпадающий список автозаполнения Куда -->
                    <div id="nav-dropdown-dest" class="nav-autocomplete-dropdown absolute left-0 right-0 top-full mt-1 rounded-xl shadow-2xl z-50 max-h-44 overflow-y-auto custom-scroll hidden"></div>
                </div>
            </div>

            <!-- Кнопка инверсии точек -->
            <button id="btn-nav-swap" title="Поменять местами" class="nav-swap-btn w-9 h-9 rounded-xl flex items-center justify-center transition self-center flex-shrink-0">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                </svg>
            </button>
        </div>

        <!-- Переключатель лифтов: свич вкл/выкл -->
        <label id="elevators-switch-label" for="toggle-elevators-switch" class="flex items-center justify-between py-2 px-3 rounded-xl bg-slate-900/80 border border-slate-700/80 cursor-pointer select-none hover:border-sky-500/50 transition flex-shrink-0">
            <span class="text-xs font-semibold text-slate-100">Использовать лифты</span>
            <div class="switch-control ml-3 flex-shrink-0">
                <input type="checkbox" id="toggle-elevators-switch">
                <span class="switch-slider"></span>
            </div>
        </label>
        <!-- Скрытая совместимость для программных вызовов -->
        <button id="btn-toggle-elevators" type="button" class="hidden"><span id="elevators-status-text">Без лифтов</span></button>

        <!-- Кнопки направлений: сбалансированная сетка из 6 кнопок -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 text-[11px] pt-0.5 flex-shrink-0">
            <button id="btn-quick-toilet" type="button" title="Построить маршрут к ближайшему туалету" class="nav-quick-chip btn-interactive px-2 py-1.5 rounded-lg flex items-center justify-center transition font-medium w-full">
                <span class="truncate">Ближайший туалет</span>
            </button>
            <button class="nav-quick-chip btn-interactive px-2 py-1.5 rounded-lg flex items-center justify-center transition font-medium w-full" data-target="Главный вход">
                <span class="truncate">Главный вход</span>
            </button>
            <button class="nav-quick-chip btn-interactive px-2 py-1.5 rounded-lg flex items-center justify-center transition font-medium w-full" data-target="Главный вход 2">
                <span class="truncate">Главный вход 2</span>
            </button>
            <button class="nav-quick-chip btn-interactive px-2 py-1.5 rounded-lg flex items-center justify-center transition font-medium w-full" data-target="Столовая">
                <span class="truncate">Столовая</span>
            </button>
            <button class="nav-quick-chip btn-interactive px-2 py-1.5 rounded-lg flex items-center justify-center transition font-medium w-full" data-target="Спортзал">
                <span class="truncate">Спортзал</span>
            </button>
            <button class="nav-quick-chip btn-interactive px-2 py-1.5 rounded-lg flex items-center justify-center transition font-medium w-full" data-target="Актовый зал">
                <span class="truncate">Актовый зал</span>
            </button>
        </div>

        <div class="flex items-center justify-between pt-1.5 border-t border-slate-700/60 flex-shrink-0">
            <button id="btn-nav-clear" class="text-xs text-slate-400 hover:text-slate-200 transition py-1.5 px-2.5 rounded-lg hover:bg-slate-800/40">Сбросить</button>
            <button id="btn-confirm-route" class="btn-interactive px-5 py-2 rounded-xl text-xs font-bold bg-sky-600 hover:bg-sky-500 text-white shadow-lg transition flex items-center gap-1.5">
                <span>Построить маршрут</span>
                <span class="text-xs">➔</span>
            </button>
        </div>
    </div>

    <!-- Плавающий баннер режима указания точки на карте -->
    <div id="nav-pick-banner" class="fixed top-16 sm:top-24 left-1/2 -translate-x-1/2 z-30 glass-panel px-4 py-2 rounded-2xl border border-sky-500/40 shadow-2xl flex items-center gap-3 hidden max-w-[92vw]">
        <div class="w-2.5 h-2.5 rounded-full bg-sky-500 animate-pulse flex-shrink-0"></div>
        <span id="nav-pick-text" class="text-xs font-medium text-slate-100 truncate">Нажмите на любой кабинет на карте</span>
        <button id="btn-cancel-pick" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-semibold border border-slate-700/60 ml-1 flex-shrink-0">Отмена</button>
    </div>

    <!-- Нижняя плавающая карточка активного маршрута -->
    <div id="navigator-route-card" class="fixed bottom-4 left-2 right-2 sm:left-1/2 sm:-translate-x-1/2 sm:w-full sm:max-w-md z-30 glass-panel p-3.5 rounded-2xl border border-sky-500/40 shadow-2xl flex flex-col gap-2.5 hidden transition-all duration-300">
        <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0 flex-1">
                <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2">
                        <span id="nav-card-time" class="text-xs font-extrabold text-white">~1 мин</span>
                        <span class="text-slate-500 text-[10px]">•</span>
                        <span id="nav-card-dist" class="text-xs font-medium text-slate-300">85 м</span>
                    </div>
                    <div id="nav-card-title" class="text-[11px] font-semibold text-sky-500 truncate cursor-pointer">105 ➔ 208</div>
                </div>
            </div>

            <div class="flex items-center gap-1.5 flex-shrink-0">
                <!-- Кнопка разворачивания пошаговых инструкций -->
                <button id="btn-toggle-steps" title="Пошаговые инструкции" class="btn-interactive w-8 h-8 rounded-lg flex items-center justify-center bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-700/80 transition">
                    <svg class="w-4 h-4 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <!-- Кнопка закрытия маршрута -->
                <button id="btn-card-close" title="Закрыть маршрут" class="btn-interactive w-8 h-8 rounded-lg flex items-center justify-center bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/80 transition">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Поэтажный навигатор маршрута -->
        <div class="flex items-center gap-1.5 pt-1.5 border-t border-slate-700/60">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mr-1">Этажи:</span>
            <div id="nav-card-floors" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
        </div>

        <!-- Разворачиваемый блок пошаговых указаний -->
        <div id="nav-steps-container" class="hidden pt-2 border-t border-slate-700/60 max-h-48 overflow-y-auto custom-scroll">
            <ul id="nav-steps-list" class="flex flex-col gap-1"></ul>
        </div>
    </div>

    <!-- Всплывающий контекстный виджет при клике на кабинет на карте -->
    <div id="room-context-popup" class="fixed z-40 glass-panel p-2.5 rounded-xl border border-slate-700/80 shadow-2xl flex flex-col gap-2 hidden pointer-events-auto min-w-[196px] max-w-[260px]">
        <div class="flex items-center justify-between gap-2 pb-1 border-b border-slate-700/60">
            <span id="popup-room-name" class="font-bold text-xs text-white truncate">Кабинет</span>
            <button id="btn-close-room-popup" class="text-slate-400 hover:text-white p-0.5 flex-shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div class="flex items-center gap-1.5">
            <button id="btn-popup-from" class="btn-interactive flex-1 py-1.5 px-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-[11px] flex items-center justify-center shadow-sm transition">
                <span>Отсюда</span>
            </button>
            <button id="btn-popup-to" class="btn-interactive flex-1 py-1.5 px-2.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-semibold text-[11px] flex items-center justify-center shadow-sm transition">
                <span>Сюда</span>
            </button>
        </div>
    </div>

    <!-- Скрытые элементы для обратной совместимости -->
    <div style="display:none">
        <button id="btn-open-settings"></button>
        <button id="btn-close-settings"></button>
        <div id="settings-backdrop"></div>
        <aside id="settings-drawer">
            <span id="wall-height-val">0.35 м</span>
            <input id="slider-wall-height" type="range" min="0.15" max="3.0" step="0.05" value="0.35">
            <button id="btn-wall-min"></button>
            <button id="btn-wall-mid"></button>
            <button id="btn-wall-max"></button>
            <button id="btn-labelsize-normal"></button>
            <button id="btn-labelsize-large"></button>
            <button id="btn-labelsize-xl"></button>
            <button id="btn-view-top"></button>
            <button id="btn-view-3d"></button>
            <button id="btn-view-305"></button>
            <button id="btn-view-side"></button>
            <span id="slice-val">1–7 эт.</span>
            <input id="slider-slice" type="range" min="1" max="7" step="1" value="7">
            <span id="explode-val">0.0 м</span>
            <input id="slider-explode" type="range" min="0" max="14" step="0.2" value="0">
            <input id="toggle-labels" type="checkbox" checked>
            <input id="toggle-doors" type="checkbox" checked>
            <input id="toggle-edges" type="checkbox" checked>
            <input id="toggle-shadows" type="checkbox">
            <input id="toggle-territory" type="checkbox">
            <input id="toggle-roof" type="checkbox">
            <button id="btn-reset-settings"></button>
        </aside>
        <button id="btn-mode-all"></button>
        <button id="btn-mode-side"></button>
        <button id="btn-mode-1"></button>
        <button id="btn-mode-2"></button>
        <button id="btn-mode-3"></button>
        <button id="btn-mode-4"></button>
        <button id="btn-mode-5"></button>
        <button id="btn-mode-6"></button>
        <button id="btn-mode-7"></button>
        <button id="btn-explode"></button>
        <button id="btn-preset-eco"></button>
        <button id="btn-preset-balance"></button>
        <button id="btn-preset-ultra"></button>
        <input id="slider-slab-opacity" type="range" min="0.25" max="1.0" step="0.05" value="1.0">
        <span id="slab-opacity-val">100%</span>
        <input id="toggle-smart-occlusion" type="checkbox" checked>
        <input id="toggle-stair-axes" type="checkbox">
        <input id="toggle-guides" type="checkbox">
        <span id="status-subtitle"></span>
    </div>

    <!-- Подключение JS модулей -->
    <script src="js/state.js?v=15"></script>
    <script src="js/materials.js?v=15"></script>
    <script src="js/helpers.js?v=15"></script>
    <script src="js/buildings/building1.js?v=15"></script>
    <script src="js/buildings/building2.js?v=15"></script>
    <script src="js/buildings/building3.js?v=15"></script>
    <script src="js/buildings/building4.js?v=15"></script>
    <script src="js/buildings/building5.js?v=15"></script>
    <script src="js/territory.js?v=15"></script>
    <script src="js/controls.js?v=15"></script>
    <script src="js/navigator.js?v=15"></script>
    <script src="js/ui.js?v=15"></script>
    <script src="js/main.js?v=15"></script>
</body>
</html>
